[package]
name    = "libhmalloc"
version = "0.1.0"
edition = "2021"
license = "BSD-2-Clause"

[lib]
name       = "hmalloc"
# cdylib produces libhmalloc.so for LD_PRELOAD / C linking.
# rlib lets the integration tests link the public API directly.
crate-type = ["cdylib", "rlib"]

[dependencies]
libc             = { workspace = true }
once_cell        = { workspace = true }
tikv-jemalloc-sys = "0.5"

[build-dependencies]
